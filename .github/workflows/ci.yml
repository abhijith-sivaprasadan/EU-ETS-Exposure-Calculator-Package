name: ci

on:
  schedule:
    - cron: "17 3 * * 3"
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PYTHONUTF8: "1"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app_streamlit.py eu_ets_cli.py eu_ets_calc_io.py tests

      - name: Format check (black)
        run: black --check app_streamlit.py eu_ets_cli.py eu_ets_calc_io.py tests

      - name: Run tests
        run: python -m pytest -q

      - name: Workbook scientific smoke test
        run: python eu_ets_cli.py --workbook EU_ETS_Exposure_Calculator_Demo.xlsx
