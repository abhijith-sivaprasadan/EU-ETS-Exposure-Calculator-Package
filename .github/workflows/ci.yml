name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app_streamlit.py eu_ets_cli.py eu_ets_calc_io.py tests

      - name: Format check (black)
        run: black --check app_streamlit.py eu_ets_cli.py eu_ets_calc_io.py tests

      - name: Run tests
        run: python -m pytest -q

      - name: Workbook scientific smoke test
        run: python eu_ets_cli.py --workbook EU_ETS_Exposure_Calculator_Demo.xlsx
